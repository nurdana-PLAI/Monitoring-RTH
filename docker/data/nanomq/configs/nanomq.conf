# NanoMQ Configuration for Kafka/Redpanda Bridge

bridges.kafka.mq_to_kafka {
    # The address of your Cloud Redpanda broker
    server = "redpanda-0:9092"
    # Protocol version 4 corresponds to Kafka v2.0.0+
    proto_ver = 4
    
    # Map MQTT topics to Redpanda topics
    # Syntax: "local_mqtt_topic" = "remote_kafka_topic"
    topics = {
        "smartenv/#" = "raw_telemetry"
    }
}