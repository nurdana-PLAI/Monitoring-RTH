http:
  enabled: true
  address: "0.0.0.0:4195"

input:
  redpanda:
    seed_brokers: ["redpanda-0:9092"]
    topics: ["raw_telemetry"]
    consumer_group: "rp-connect-minio-sink-group"

pipeline:
  processors:
    # 1. Parse JSON and unroll the array (same as QuestDB sink)
    - bloblang: |
        if this.type() == "string" {
          root = this.parse_json()
        }
    - bloblang: |
        let ts_val = this.ts
        let loc_val = this.loc_id
        root = this.readings.map_each(r -> {
          "timestamp": $ts_val,
          "loc_id": $loc_val,
          "sensor_id": r.sensor_id,
          "sensor_type": r.type,
          "unit": r.unit,
          "value": r.val
        })
    - unarchive:
        format: json_array

output:
  aws_s3:
    endpoint: http://minio:9002
    region: us-east-1
    bucket: green-infra-data
    # Hive-style partitioning based on ingestion time. UUID ensures unique filenames.
    path: "sensor_readings/year=${! now().ts_format(\"2006\") }/month=${! now().ts_format(\"01\") }/day=${! now().ts_format(\"02\") }/part-${! uuid_v4() }.json"
    content_type: "application/json"
    # NDJSON codec: concatenates batched messages with newlines
    # codec: lines
    max_in_flight: 16
    force_path_style_urls: true
    batching:
      count: 50
      period: 10s
    credentials:
      id: minioadmin
      secret: minioadmin